name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.1"
          cache: true
      - name: Install host SQLite
        run: sudo apt-get update && sudo apt-get install --yes sqlite3
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generated code is current
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib/data/app_database.g.dart
      - name: Format is current
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test --test-randomize-ordering-seed random
      - name: Build Android release
        run: flutter build apk --release
